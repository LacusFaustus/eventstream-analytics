server:
  port: 8080

spring:
  application:
    name: data-generator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

generator:
  events-per-second: ${GENERATOR_EVENTS_PER_SECOND:1000}

kafka:
  topics:
    events-raw: events.raw.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    ru.faustus: INFO
    org.apache.kafka: WARN