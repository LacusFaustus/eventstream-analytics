replicaCount: 2

image:
  repository: faustus/analytics-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8088

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

clickhouse:
  host: clickhouse
  database: analytics
  user: admin
  password: clickhouse_pass

redis:
  host: redis
  password: redis_pass

ingress:
  enabled: true
  host: analytics.example.com