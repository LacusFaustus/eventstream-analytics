
groups:
  - name: analytics_alerts
    interval: 30s
    rules:
      - alert: DataPipelineLag
        expr: kafka_consumer_lag > 100000
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer lag is {{ $value }} messages"

      - alert: FlinkJobRestarts
        expr: flink_job_restarts > 3
        for: 10m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Flink job is restarting frequently"
          description: "Job restarted {{ $value }} times"

      - alert: ClickHouseQuerySlow
        expr: clickhouse_query_duration_seconds > 5
        for: 2m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Slow ClickHouse queries detected"
          description: "Query took {{ $value }}s"

      - alert: AnalyticsAPIErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", application="analytics-api"}[5m]))
          / sum(rate(http_server_requests_seconds_count{application="analytics-api"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate in Analytics API"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: LowEventVolume
        expr: rate(events_total[5m]) < 100
        for: 10m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Low event volume detected"
          description: "Less than 100 events per second"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 5
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Disk space is critically low"
          description: "Available disk space is {{ $value }}%"