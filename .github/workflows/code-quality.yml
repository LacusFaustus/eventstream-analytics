name: Code Quality Checks

on:
  push:
    branches: [ "main", "develop", "eventstream-analytics" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check || echo "Checkstyle warnings found"

      - name: Run SpotBugs
        run: mvn spotbugs:check || echo "SpotBugs warnings found"

      - name: Run tests with coverage
        run: |
           mvn test
           mvn jacoco:report -Djacoco.skip=false || echo "Coverage report skipped"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/target/site/jacoco/
            !**/target/site/jacoco/jacoco-sessions.xml