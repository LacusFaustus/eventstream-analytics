name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "eventstream-analytics" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          # ✅ Преобразование в нижний регистр
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Сборка data-generator
          echo "📦 Building data-generator..."
          docker build -t ghcr.io/$REPO/data-generator:${{ github.sha }} \
            -f ./ingestion/data-generator/Dockerfile ./ingestion/data-generator
          docker push ghcr.io/$REPO/data-generator:${{ github.sha }}
          echo "✅ data-generator pushed"
          
          # Сборка analytics-api
          echo "📦 Building analytics-api..."
          docker build -t ghcr.io/$REPO/analytics-api:${{ github.sha }} \
            -f ./serving/analytics-api/Dockerfile ./serving/analytics-api
          docker push ghcr.io/$REPO/analytics-api:${{ github.sha }}
          echo "✅ analytics-api pushed"