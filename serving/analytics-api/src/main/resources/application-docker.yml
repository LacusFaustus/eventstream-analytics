server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: analytics-api

  # ============================================================
  # REDIS (Кэширование)
  # ============================================================
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis_pass}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 минут
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "analytics:"

  # ============================================================
  # CLICKHOUSE (База данных)
  # ============================================================
  datasource:
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:clickhouse}:8123/${CLICKHOUSE_DB:analytics}
    username: ${CLICKHOUSE_USER:admin}
    password: ${CLICKHOUSE_PASSWORD:clickhouse_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # ELASTICSEARCH (Поиск и логи)
  # ============================================================
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}
    connection-timeout: 5000
    socket-timeout: 30000

  # ============================================================
  # MANAGEMENT (Actuator)
  # ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: analytics-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    ru.faustus: INFO
    org.springframework.web: INFO
    org.springframework.cache: DEBUG
    com.clickhouse: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"